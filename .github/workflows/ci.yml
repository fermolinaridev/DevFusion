name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      # Ubuntu 24.04 restringe namespaces de usuário sem privilégio (AppArmor), o que impede o sandbox do Chromium.
      - name: Preparar sandbox do Electron (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: E2E (Linux, display virtual)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test --reporter=list,github

      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test --reporter=list,github

      # Fase 8: empacota (sem instalador) e testa o app empacotado com as Fuses ativas.
      - name: Empacotar (pasta)
        run: npx electron-builder --dir --publish never

      - name: Teste do app empacotado (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:package -- --reporter=list,github
        env:
          DEVFUSION_PACKAGED_EXE: ${{ github.workspace }}/release/linux-unpacked/devfusion

      - name: Teste do app empacotado (Windows)
        if: runner.os == 'Windows'
        run: npm run test:package -- --reporter=list,github
        env:
          DEVFUSION_PACKAGED_EXE: ${{ github.workspace }}\release\win-unpacked\DevFusion.exe

      - name: Guardar resultados em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 7
